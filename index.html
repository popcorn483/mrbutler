<title>Teacher Hub · Locked</title>
<style>
:root{--bg:#16233b;--card:#fff;--ink:#1b2420;--ink2:#5d6863;--line:#d6dbd3;--acc:#1f6f5c;--bad:#b4372f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0c1220;--card:#1a201d;--ink:#e7ece9;--ink2:#a3ada7;--line:#3a4540;--acc:#4fb393;--bad:#ef7e74;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);background-image:radial-gradient(circle at 20% 10%,rgba(79,179,147,.18),transparent 45%),radial-gradient(circle at 85% 90%,rgba(43,95,168,.25),transparent 50%);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink)}
.card{background:var(--card);width:min(400px,100%);border-radius:14px;padding:30px 28px 24px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.logo{width:46px;height:46px;border-radius:12px;background:var(--acc);display:grid;place-items:center;margin-bottom:16px}
.logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:21px;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--ink2);font-size:13.5px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.pw{position:relative}
input[type=password],input[type=text]{width:100%;font:inherit;padding:11px 44px 11px 12px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink)}
input:focus{outline:2px solid color-mix(in srgb,var(--acc) 50%,transparent);border-color:var(--acc)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink2);cursor:pointer;padding:6px;font-size:12px}
.chk{display:flex;gap:9px;align-items:flex-start;margin:14px 0 4px;font-size:13.5px;cursor:pointer}
.chk input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--acc)}
.hint{font-size:12px;color:var(--ink2);margin:0 0 18px 26px}
button.go{width:100%;font:inherit;font-weight:600;padding:11px;border:0;border-radius:9px;background:var(--acc);color:#fff;cursor:pointer}
button.go:disabled{opacity:.7;cursor:progress}
.err{color:var(--bad);font-size:13px;min-height:20px;margin-top:10px}
.foot{font-size:11.5px;color:var(--ink2);margin-top:14px;text-align:center}
</style>

      var key=await derive(document.getElementById('pw').value);
      var html=await open(key);
      await launch(key,html,document.getElementById('rem').checked);
    }catch(x){
      err.textContent='That password is not right.'; go.disabled=false; go.textContent='Unlock';
      var i=document.getElementById('pw'); i.select();
    }
  };
  (async function(){
    if(await tryStored('l','tdh.remember')) return;
    if(await tryStored('s','tdh.session')) return;
    lock.hidden=false; document.getElementById('pw').focus();
  })();
})();
